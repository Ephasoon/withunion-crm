# ════════════════════════════════════════════════════════════
#  WithUnion CRM — Local full stack (app + PostgreSQL)
#
#  Start:   docker compose up -d
#  Setup:   docker compose exec app npm run db:push && docker compose exec app npm run db:seed
#  Logs:    docker compose logs -f app
#  Stop:    docker compose down
# ════════════════════════════════════════════════════════════

services:
  postgres:
    image: postgres:17-alpine
    container_name: withunion-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-withunion_crm}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - withunion_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: withunion-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@postgres:5432/${DB_NAME:-withunion_crm}
      JWT_SECRET: ${JWT_SECRET:-change_me_in_production}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-change_me_too}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ORG_NAME: ${ORG_NAME:-WithUnion Technologies}
      ORG_CURRENCY: ${ORG_CURRENCY:-ETB}
    ports:
      - "3000:3000"

volumes:
  withunion_pgdata:
