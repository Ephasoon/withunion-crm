# ════════════════════════════════════════════════════════════
#  WithUnion CRM — Local full stack (app + PostgreSQL)
#
#  Start:   docker compose up -d --build
#  Seed:    docker compose run --rm seed
#  Logs:    docker compose logs -f app
#  Stop:    docker compose down
#
#  DEMO_PASSWORD must be set in .env (or the shell) before seeding.
# ════════════════════════════════════════════════════════════

services:
  postgres:
    image: postgres:17-alpine
    container_name: withunion-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      POSTGRES_DB: ${DB_NAME:-withunion_crm}
    # Bound to loopback only, on a non-default host port, so the database is
    # not reachable from other machines. The app talks to it over the Docker
    # network; use this only for local psql access.
    ports:
      - "127.0.0.1:${DB_HOST_PORT:-5433}:5432"
    volumes:
      - withunion_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Applies the current Drizzle schema before the app starts.
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: tools
    command: ["npm", "run", "db:push"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${DB_USER:-postgres}:${DB_PASSWORD:?Set DB_PASSWORD in .env}@postgres:5432/${DB_NAME:-withunion_crm}
      DIRECT_URL: ${DIRECT_URL:-}

  # One-off demo data load. Kept out of `up` so it does not run automatically.
  # WARNING: it deletes ALL existing rows before inserting demo data; in
  # production it also requires ALLOW_SEED_WIPE=true.
  seed:
    profiles: ["tools"]
    build:
      context: .
      dockerfile: Dockerfile
      target: tools
    command: ["npm", "run", "db:seed"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${DB_USER:-postgres}:${DB_PASSWORD:?Set DB_PASSWORD in .env}@postgres:5432/${DB_NAME:-withunion_crm}
      DIRECT_URL: ${DIRECT_URL:-}
      DEMO_PASSWORD: "${DEMO_PASSWORD:?Set DEMO_PASSWORD in .env or the shell before seeding}"
      ALLOW_SEED_WIPE: ${ALLOW_SEED_WIPE:-}

  # Creates the first real owner without loading demo data.
  #   docker compose run --rm create-owner
  create-owner:
    profiles: ["tools"]
    build:
      context: .
      dockerfile: Dockerfile
      target: tools
    command: ["npm", "run", "db:create-owner"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    stdin_open: true
    tty: true
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${DB_USER:-postgres}:${DB_PASSWORD:?Set DB_PASSWORD in .env}@postgres:5432/${DB_NAME:-withunion_crm}
      DIRECT_URL: ${DIRECT_URL:-}
      OWNER_EMAIL: ${OWNER_EMAIL:-}
      OWNER_NAME: ${OWNER_NAME:-}
      OWNER_PASSWORD: ${OWNER_PASSWORD:-}
      ORG_SLUG: ${ORG_SLUG:-withunion}
      ORG_NAME: ${ORG_NAME:-WithUnion Technologies}
      ORG_CURRENCY: ${ORG_CURRENCY:-ETB}
      ORG_COUNTRY: ${ORG_COUNTRY:-Ethiopia}
      ORG_TIMEZONE: ${ORG_TIMEZONE:-Africa/Addis_Ababa}
      ORG_TAX_RATE: ${ORG_TAX_RATE:-15}
      ORG_COMMISSION_RATE: ${ORG_COMMISSION_RATE:-5}

  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    container_name: withunion-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://${DB_USER:-postgres}:${DB_PASSWORD:?Set DB_PASSWORD in .env}@postgres:5432/${DB_NAME:-withunion_crm}
      DIRECT_URL: ${DIRECT_URL:-}
      STORAGE_DIR: /app/storage/uploads
      SESSION_TTL_DAYS: ${SESSION_TTL_DAYS:-7}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ORG_NAME: ${ORG_NAME:-WithUnion Technologies}
      ORG_CURRENCY: ${ORG_CURRENCY:-ETB}
    ports:
      - "3000:3000"
    volumes:
      - withunion_uploads:/app/storage
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3

volumes:
  withunion_pgdata:
  withunion_uploads:
